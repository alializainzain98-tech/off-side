name: mal3ab
description: "Offside"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  mesh_gradient: ^1.3.8
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#C6F432"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
